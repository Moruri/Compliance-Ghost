<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Compliance Ghost</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ec6cb9'/%3E%3Cstop offset='50%25' stop-color='%23a371f7'/%3E%3Cstop offset='100%25' stop-color='%232f81f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8 0l1.6 5L14 8l-4.4 1.5L8 14l-1.6-4.5L2 8l4.4-3z'/%3E%3C/svg%3E"
    />
    <!--
      Pre-paint theme setter — runs before any stylesheet to avoid a flash of
      wrong theme. Reads localStorage; falls back to dark.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cg.theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0d1117' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gh-canvas text-gh-fg font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
